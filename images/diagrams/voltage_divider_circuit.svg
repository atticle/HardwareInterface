<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="480" height="400" fill="#ffffff"/>
  <text x="240" y="26" font-size="17" font-weight="bold" text-anchor="middle" fill="#111111">Voltage Divider Circuit</text>

  <text x="240" y="55" font-size="12" text-anchor="middle" fill="#555555">Vin</text>
  <line x1="240" y1="60" x2="240" y2="90" stroke="#333333" stroke-width="2"/>

  <rect x="215" y="90" width="50" height="55" fill="#fff7e0" stroke="#a17d00" stroke-width="1.5"/>
  <text x="240" y="122" font-size="13" text-anchor="middle" fill="#111111">R1</text>

  <line x1="240" y1="145" x2="240" y2="180" stroke="#333333" stroke-width="2"/>
  <circle cx="240" cy="180" r="4" fill="#111111"/>
  <line x1="255" y1="180" x2="340" y2="180" stroke="#333333" stroke-width="2"/>
  <text x="400" y="165" font-size="12" text-anchor="middle" fill="#003a8c">Vout</text>
  <text x="400" y="182" font-size="11" text-anchor="middle" fill="#003a8c">to ADC pin</text>

  <line x1="240" y1="180" x2="240" y2="215" stroke="#333333" stroke-width="2"/>
  <rect x="215" y="215" width="50" height="55" fill="#fff7e0" stroke="#a17d00" stroke-width="1.5"/>
  <text x="240" y="247" font-size="13" text-anchor="middle" fill="#111111">R2</text>

  <line x1="240" y1="270" x2="240" y2="300" stroke="#333333" stroke-width="2"/>
  <text x="240" y="318" font-size="12" text-anchor="middle" fill="#555555">GND</text>

  <rect x="60" y="330" width="360" height="55" rx="6" fill="#f5f5f5" stroke="#888888" stroke-width="1"/>
  <text x="240" y="362" font-size="14" text-anchor="middle" fill="#111111">Vout = Vin x R2 / (R1 + R2)</text>
</svg>
