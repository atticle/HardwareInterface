<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="400" fill="#ffffff"/>
  <text x="320" y="26" font-size="17" font-weight="bold" text-anchor="middle" fill="#111111">Multi-Channel ADC Scanning</text>

  <rect x="40" y="60" width="130" height="45" rx="6" fill="#e7f0fb" stroke="#003a8c" stroke-width="1.5"/>
  <text x="105" y="88" font-size="12" text-anchor="middle" fill="#111111">PA0: IN0 (Dimmer)</text>
  <line x1="170" y1="82" x2="260" y2="120" stroke="#333333" stroke-width="2" marker-end="url(#arrow3)"/>

  <rect x="40" y="130" width="130" height="45" rx="6" fill="#e7f0fb" stroke="#003a8c" stroke-width="1.5"/>
  <text x="105" y="152" font-size="11" text-anchor="middle" fill="#111111">PA1: IN1 (Light</text>
  <text x="105" y="166" font-size="11" text-anchor="middle" fill="#111111">Sensor)</text>
  <line x1="170" y1="152" x2="260" y2="135" stroke="#333333" stroke-width="2" marker-end="url(#arrow3)"/>

  <rect x="260" y="100" width="90" height="50" rx="6" fill="#fff7e0" stroke="#a17d00" stroke-width="1.5"/>
  <text x="305" y="130" font-size="12" text-anchor="middle" fill="#111111">MUX</text>

  <line x1="350" y1="125" x2="410" y2="125" stroke="#333333" stroke-width="2" marker-end="url(#arrow3)"/>
  <rect x="410" y="100" width="120" height="50" rx="6" fill="#e2f5e9" stroke="#006622" stroke-width="1.5"/>
  <text x="470" y="130" font-size="12" text-anchor="middle" fill="#111111">ADC1</text>

  <text x="320" y="220" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111">Conversion Sequence (Scan Mode)</text>
  <rect x="100" y="240" width="150" height="45" fill="#e7f0fb" stroke="#003a8c" stroke-width="1.5"/>
  <text x="175" y="267" font-size="13" text-anchor="middle" fill="#111111">Convert IN0</text>
  <line x1="250" y1="262" x2="330" y2="262" stroke="#333333" stroke-width="2" marker-end="url(#arrow3)"/>
  <rect x="330" y="240" width="150" height="45" fill="#e7f0fb" stroke="#003a8c" stroke-width="1.5"/>
  <text x="405" y="267" font-size="13" text-anchor="middle" fill="#111111">Convert IN1</text>

  <path d="M480,285 C 550,320 250,320 100,285" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow3)"/>
  <text x="290" y="335" font-size="11" text-anchor="middle" fill="#555555">repeats automatically</text>

  <rect x="60" y="355" width="520" height="35" rx="6" fill="#f5f5f5" stroke="#888888" stroke-width="1"/>
  <text x="320" y="377" font-size="12" text-anchor="middle" fill="#111111">One HAL_ADC_Start reads both channels in order</text>
</svg>
