<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 800 430"
   width="800"
   height="430"
   font-family="Arial, sans-serif"
   version="1.1"
   id="rising-falling-edge"
   xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker
       id="arrowhead"
       markerWidth="8"
       markerHeight="8"
       refX="7"
       refY="4"
       orient="auto"
       markerUnits="strokeWidth">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#555555" />
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="430" fill="#ffffff" />

  <text x="400" y="32" font-size="20" font-weight="bold" text-anchor="middle" fill="#111111">
    Rising Edge and Falling Edge
  </text>
  <text x="400" y="57" font-size="12" text-anchor="middle" fill="#555555">
    A digital edge is a change from one logic level to the other.
  </text>

  <rect x="35" y="78" width="730" height="145" fill="#f8fbff" stroke="#b7c8d9" stroke-width="1.5" />
  <text x="58" y="107" font-size="16" font-weight="bold" fill="#005a9c">
    Rising Edge
  </text>
  <text x="58" y="128" font-size="12" fill="#333333">
    LOW to HIGH (0 to 1)
  </text>

  <text x="177" y="160" font-size="12" text-anchor="end" fill="#555555">HIGH</text>
  <text x="177" y="201" font-size="12" text-anchor="end" fill="#555555">LOW</text>
  <line x1="195" y1="155" x2="710" y2="155" stroke="#d2dbe3" stroke-width="1" />
  <line x1="195" y1="196" x2="710" y2="196" stroke="#d2dbe3" stroke-width="1" />
  <path d="M 195 196 H 445 V 155 H 710" fill="none" stroke="#005a9c" stroke-width="4" stroke-linejoin="round" />
  <line x1="445" y1="137" x2="445" y2="190" stroke="#c46a00" stroke-width="2" stroke-dasharray="5,4" />
  <line x1="480" y1="115" x2="450" y2="136" stroke="#555555" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="535" y="112" font-size="12" text-anchor="middle" fill="#c46a00">
    Signal changes here
  </text>
  <text x="535" y="211" font-size="12" text-anchor="middle" fill="#005a9c">
    Trigger on the upward transition
  </text>

  <rect x="35" y="245" width="730" height="145" fill="#fffaf7" stroke="#ddc5b8" stroke-width="1.5" />
  <text x="58" y="274" font-size="16" font-weight="bold" fill="#a13b00">
    Falling Edge
  </text>
  <text x="58" y="295" font-size="12" fill="#333333">
    HIGH to LOW (1 to 0)
  </text>

  <text x="177" y="327" font-size="12" text-anchor="end" fill="#555555">HIGH</text>
  <text x="177" y="368" font-size="12" text-anchor="end" fill="#555555">LOW</text>
  <line x1="195" y1="322" x2="710" y2="322" stroke="#e5d9d3" stroke-width="1" />
  <line x1="195" y1="363" x2="710" y2="363" stroke="#e5d9d3" stroke-width="1" />
  <path d="M 195 322 H 445 V 363 H 710" fill="none" stroke="#a13b00" stroke-width="4" stroke-linejoin="round" />
  <line x1="445" y1="304" x2="445" y2="357" stroke="#c46a00" stroke-width="2" stroke-dasharray="5,4" />
  <line x1="480" y1="282" x2="450" y2="303" stroke="#555555" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="535" y="279" font-size="12" text-anchor="middle" fill="#c46a00">
    Signal changes here
  </text>
  <text x="535" y="378" font-size="12" text-anchor="middle" fill="#a13b00">
    Trigger on the downward transition
  </text>

  <text x="400" y="416" font-size="12" text-anchor="middle" fill="#555555">
    The edge is the transition, not the stable HIGH or LOW level.
  </text>
</svg>
