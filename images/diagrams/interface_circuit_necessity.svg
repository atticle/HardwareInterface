<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="420" fill="#ffffff"/>
  <text x="320" y="26" font-size="17" font-weight="bold" text-anchor="middle" fill="#111111">Why an Interface Circuit Is Needed</text>

  <!-- Panel A -->
  <text x="20" y="60" font-size="14" font-weight="bold" fill="#a10000">Case A: Direct Connection (No Interface Circuit)</text>
  <rect x="20" y="75" width="130" height="60" rx="6" fill="#fde2e2" stroke="#a10000" stroke-width="1.5"/>
  <text x="85" y="100" font-size="13" text-anchor="middle" fill="#111111">Battery</text>
  <text x="85" y="118" font-size="13" text-anchor="middle" fill="#111111">12V</text>

  <line x1="150" y1="105" x2="280" y2="105" stroke="#333333" stroke-width="2" marker-end="url(#arrow1)"/>

  <rect x="280" y="75" width="180" height="60" rx="6" fill="#fde2e2" stroke="#a10000" stroke-width="1.5"/>
  <text x="370" y="100" font-size="13" text-anchor="middle" fill="#111111">MCU Pin</text>
  <text x="370" y="118" font-size="13" text-anchor="middle" fill="#111111">(3.3V max rating)</text>

  <g stroke="#a10000" stroke-width="4" stroke-linecap="round">
    <line x1="500" y1="160" x2="520" y2="180"/>
    <line x1="520" y1="160" x2="500" y2="180"/>
  </g>
  <text x="370" y="180" font-size="14" font-weight="bold" text-anchor="middle" fill="#a10000">Pin Damage!</text>

  <line x1="20" y1="200" x2="620" y2="200" stroke="#cccccc" stroke-width="1"/>

  <!-- Panel B -->
  <text x="20" y="230" font-size="14" font-weight="bold" fill="#006622">Case B: With Interface Circuit</text>
  <rect x="20" y="245" width="110" height="60" rx="6" fill="#e2f5e9" stroke="#006622" stroke-width="1.5"/>
  <text x="75" y="270" font-size="13" text-anchor="middle" fill="#111111">Battery</text>
  <text x="75" y="288" font-size="13" text-anchor="middle" fill="#111111">12V</text>

  <line x1="130" y1="275" x2="210" y2="275" stroke="#333333" stroke-width="2" marker-end="url(#arrow1)"/>

  <rect x="210" y="245" width="200" height="60" rx="6" fill="#e2f5e9" stroke="#006622" stroke-width="1.5"/>
  <text x="310" y="270" font-size="13" text-anchor="middle" fill="#111111">Interface Circuit</text>
  <text x="310" y="288" font-size="12" text-anchor="middle" fill="#111111">(Regulator / Transistor)</text>

  <line x1="410" y1="275" x2="490" y2="275" stroke="#333333" stroke-width="2" marker-end="url(#arrow1)"/>

  <rect x="490" y="245" width="130" height="60" rx="6" fill="#e2f5e9" stroke="#006622" stroke-width="1.5"/>
  <text x="555" y="270" font-size="13" text-anchor="middle" fill="#111111">MCU Pin</text>
  <text x="555" y="288" font-size="13" text-anchor="middle" fill="#111111">(3.3V safe)</text>

  <path d="M535,340 l10,12 l20,-24" stroke="#006622" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="310" y="360" font-size="14" font-weight="bold" text-anchor="middle" fill="#006622">Safe Operation</text>
</svg>
