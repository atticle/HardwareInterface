<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="420" fill="#ffffff"/>
  <text x="320" y="26" font-size="17" font-weight="bold" text-anchor="middle" fill="#111111">Shield Power Rail Modification</text>

  <!-- Before -->
  <text x="150" y="55" font-size="14" font-weight="bold" text-anchor="middle" fill="#a10000">Before: 5V Rail</text>
  <rect x="60" y="70" width="90" height="45" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/>
  <text x="105" y="97" font-size="12" text-anchor="middle" fill="#111111">Arduino 5V</text>
  <line x1="150" y1="92" x2="200" y2="92" stroke="#333333" stroke-width="2"/>
  <rect x="200" y="70" width="110" height="45" rx="6" fill="#fdeaea" stroke="#a10000" stroke-width="1.5"/>
  <text x="255" y="88" font-size="11" text-anchor="middle" fill="#111111">Shield 5V Rail</text>
  <text x="255" y="103" font-size="11" text-anchor="middle" fill="#111111">(Sensors A0/A1)</text>

  <line x1="310" y1="92" x2="360" y2="92" stroke="#333333" stroke-width="2"/>
  <rect x="360" y="70" width="110" height="45" rx="6" fill="#fdeaea" stroke="#a10000" stroke-width="1.5"/>
  <text x="415" y="88" font-size="11" text-anchor="middle" fill="#111111">Output up to</text>
  <text x="415" y="103" font-size="11" text-anchor="middle" fill="#111111">5V (unsafe)</text>

  <g stroke="#a10000" stroke-width="4" stroke-linecap="round">
    <line x1="490" y1="80" x2="510" y2="105"/>
    <line x1="510" y1="80" x2="490" y2="105"/>
  </g>
  <text x="500" y="130" font-size="12" font-weight="bold" text-anchor="middle" fill="#a10000">Exceeds 3.3V ADC limit</text>

  <line x1="20" y1="160" x2="620" y2="160" stroke="#cccccc" stroke-width="1"/>

  <!-- After -->
  <text x="150" y="195" font-size="14" font-weight="bold" text-anchor="middle" fill="#006622">After: 3V3 Rewired</text>

  <rect x="60" y="215" width="90" height="45" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/>
  <text x="105" y="242" font-size="12" text-anchor="middle" fill="#111111">Arduino 5V</text>
  <line x1="150" y1="237" x2="175" y2="237" stroke="#a10000" stroke-width="2"/>
  <g stroke="#a10000" stroke-width="3" stroke-linecap="round">
    <line x1="170" y1="230" x2="185" y2="245"/>
    <line x1="185" y1="230" x2="170" y2="245"/>
  </g>
  <text x="177" y="215" font-size="11" text-anchor="middle" fill="#a10000">trace cut</text>

  <rect x="60" y="285" width="90" height="45" rx="6" fill="#e2f5e9" stroke="#006622" stroke-width="1.5"/>
  <text x="105" y="312" font-size="12" text-anchor="middle" fill="#111111">Arduino 3V3</text>
  <line x1="150" y1="307" x2="255" y2="307" stroke="#006622" stroke-width="2"/>
  <line x1="255" y1="307" x2="255" y2="260" stroke="#006622" stroke-width="2"/>

  <rect x="200" y="215" width="110" height="45" rx="6" fill="#e2f5e9" stroke="#006622" stroke-width="1.5"/>
  <text x="255" y="233" font-size="11" text-anchor="middle" fill="#111111">Shield Rail</text>
  <text x="255" y="248" font-size="11" text-anchor="middle" fill="#111111">now = 3.3V</text>

  <line x1="310" y1="237" x2="360" y2="237" stroke="#333333" stroke-width="2"/>
  <rect x="360" y="215" width="110" height="45" rx="6" fill="#e2f5e9" stroke="#006622" stroke-width="1.5"/>
  <text x="415" y="233" font-size="11" text-anchor="middle" fill="#111111">Output max</text>
  <text x="415" y="248" font-size="11" text-anchor="middle" fill="#111111">3.3V (safe)</text>

  <path d="M480,225 l10,12 l20,-24" stroke="#006622" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="500" y="272" font-size="12" font-weight="bold" text-anchor="middle" fill="#006622">No divider needed</text>

  <rect x="60" y="350" width="520" height="55" rx="6" fill="#f5f5f5" stroke="#888888" stroke-width="1"/>
  <text x="320" y="373" font-size="12" text-anchor="middle" fill="#111111">Cutting the 5V trace and feeding 3V3 into the same rail lowers</text>
  <text x="320" y="391" font-size="12" text-anchor="middle" fill="#111111">both A0 and A1 output ranges to 0-3.3V at once</text>
</svg>
