<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="380" fill="#ffffff"/>
  <text x="320" y="26" font-size="17" font-weight="bold" text-anchor="middle" fill="#111111">Switch Bounce and Debouncing</text>

  <text x="40" y="60" font-size="13" font-weight="bold" fill="#a10000">Raw signal (mechanical bounce)</text>
  <polyline points="40,90 120,90 120,130 150,130 150,90 170,90 170,130 195,130 195,90 210,90 210,130 560,130"
            fill="none" stroke="#a10000" stroke-width="2"/>
  <text x="140" y="150" font-size="11" text-anchor="middle" fill="#a10000">chatter (a few ms)</text>
  <line x1="120" y1="75" x2="120" y2="145" stroke="#dddddd" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="210" y1="75" x2="210" y2="145" stroke="#dddddd" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="40" y="205" font-size="13" font-weight="bold" fill="#006622">After debounce (delay window applied)</text>
  <polyline points="40,235 210,235 210,275 560,275" fill="none" stroke="#006622" stroke-width="2.5"/>
  <rect x="210" y="220" width="60" height="70" fill="#e2f5e9" opacity="0.6"/>
  <text x="240" y="310" font-size="11" text-anchor="middle" fill="#006622">debounce delay (10-50 ms)</text>

  <rect x="40" y="330" width="560" height="40" rx="6" fill="#f5f5f5" stroke="#888888" stroke-width="1"/>
  <text x="320" y="355" font-size="12" text-anchor="middle" fill="#111111">Debouncing waits until the signal settles before counting one press</text>
</svg>
