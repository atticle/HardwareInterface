<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="#ffffff"/>
  <text x="320" y="26" font-size="17" font-weight="bold" text-anchor="middle" fill="#111111">ADC Resolution: Quantization</text>

  <!-- axes -->
  <line x1="70" y1="330" x2="590" y2="330" stroke="#333333" stroke-width="2"/>
  <line x1="70" y1="330" x2="70" y2="60" stroke="#333333" stroke-width="2"/>
  <text x="330" y="360" font-size="13" text-anchor="middle" fill="#111111">Analog Input Voltage (0 to 3.3V)</text>
  <text x="30" y="200" font-size="13" text-anchor="middle" fill="#111111" transform="rotate(-90 30 200)">Digital Value</text>

  <!-- continuous line (dashed reference) -->
  <line x1="70" y1="330" x2="590" y2="70" stroke="#a10000" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="560" y="65" font-size="11" fill="#a10000">ideal continuous line</text>

  <!-- staircase steps -->
  <polyline points="70,330 130,330 130,290 190,290 190,250 250,250 250,210 310,210 310,170 370,170 370,130 430,130 430,95 490,95 490,70 550,70"
            fill="none" stroke="#003a8c" stroke-width="2.5"/>
  <text x="560" y="90" font-size="11" fill="#003a8c">quantized steps</text>

  <text x="70" y="345" font-size="11" text-anchor="middle" fill="#555555">0</text>
  <text x="590" y="345" font-size="11" text-anchor="middle" fill="#555555">3.3V</text>
  <text x="55" y="335" font-size="11" text-anchor="end" fill="#555555">0</text>
  <text x="55" y="75" font-size="11" text-anchor="end" fill="#555555">4095</text>

  <rect x="70" y="365" width="520" height="30" rx="6" fill="#f5f5f5" stroke="#888888" stroke-width="1"/>
  <text x="330" y="385" font-size="12" text-anchor="middle" fill="#111111">12-bit ADC: 2^12 - 1 = 4095 discrete steps (finer "ruler" ticks)</text>
</svg>
