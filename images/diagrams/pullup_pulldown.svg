<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="#ffffff"/>
  <text x="320" y="26" font-size="17" font-weight="bold" text-anchor="middle" fill="#111111">Pull-up vs Pull-down Resistor</text>

  <!-- Left: Pull-up -->
  <text x="150" y="55" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Pull-up (switch to GND)</text>
  <line x1="150" y1="70" x2="150" y2="90" stroke="#333333" stroke-width="2"/>
  <text x="150" y="65" font-size="12" text-anchor="middle" fill="#555555">VCC (3.3V)</text>
  <rect x="135" y="90" width="30" height="35" fill="#fff7e0" stroke="#a17d00" stroke-width="1.5"/>
  <text x="150" y="112" font-size="10" text-anchor="middle" fill="#111111">R</text>
  <line x1="150" y1="125" x2="150" y2="160" stroke="#333333" stroke-width="2"/>
  <circle cx="150" cy="160" r="4" fill="#111111"/>
  <line x1="165" y1="160" x2="230" y2="160" stroke="#333333" stroke-width="2"/>
  <text x="230" y="145" font-size="12" text-anchor="middle" fill="#111111">MCU Pin</text>

  <line x1="150" y1="160" x2="150" y2="195" stroke="#333333" stroke-width="2"/>
  <circle cx="150" cy="210" r="14" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/>
  <text x="150" y="214" font-size="10" text-anchor="middle" fill="#111111">SW</text>
  <line x1="150" y1="224" x2="150" y2="255" stroke="#333333" stroke-width="2"/>
  <text x="150" y="272" font-size="12" text-anchor="middle" fill="#555555">GND</text>

  <rect x="30" y="290" width="250" height="70" rx="6" fill="#f5f5f5" stroke="#888888" stroke-width="1"/>
  <text x="155" y="312" font-size="12" text-anchor="middle" fill="#111111">Switch OPEN -&gt; Pin reads HIGH</text>
  <text x="155" y="330" font-size="12" text-anchor="middle" fill="#111111">Switch CLOSED -&gt; Pin reads LOW</text>
  <text x="155" y="350" font-size="12" font-weight="bold" text-anchor="middle" fill="#a17d00">Default state = HIGH</text>

  <!-- divider -->
  <line x1="330" y1="45" x2="330" y2="365" stroke="#dddddd" stroke-width="1"/>

  <!-- Right: Pull-down -->
  <text x="480" y="55" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Pull-down (switch to VCC)</text>
  <text x="480" y="72" font-size="12" text-anchor="middle" fill="#555555">VCC (3.3V)</text>
  <line x1="480" y1="78" x2="480" y2="105" stroke="#333333" stroke-width="2"/>
  <circle cx="480" cy="120" r="14" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/>
  <text x="480" y="124" font-size="10" text-anchor="middle" fill="#111111">SW</text>
  <line x1="480" y1="134" x2="480" y2="160" stroke="#333333" stroke-width="2"/>
  <circle cx="480" cy="160" r="4" fill="#111111"/>
  <line x1="495" y1="160" x2="560" y2="160" stroke="#333333" stroke-width="2"/>
  <text x="560" y="145" font-size="12" text-anchor="middle" fill="#111111">MCU Pin</text>

  <line x1="480" y1="160" x2="480" y2="195" stroke="#333333" stroke-width="2"/>
  <rect x="465" y="195" width="30" height="35" fill="#fff7e0" stroke="#a17d00" stroke-width="1.5"/>
  <text x="480" y="217" font-size="10" text-anchor="middle" fill="#111111">R</text>
  <line x1="480" y1="230" x2="480" y2="255" stroke="#333333" stroke-width="2"/>
  <text x="480" y="272" font-size="12" text-anchor="middle" fill="#555555">GND</text>

  <rect x="360" y="290" width="250" height="70" rx="6" fill="#f5f5f5" stroke="#888888" stroke-width="1"/>
  <text x="485" y="312" font-size="12" text-anchor="middle" fill="#111111">Switch OPEN -&gt; Pin reads LOW</text>
  <text x="485" y="330" font-size="12" text-anchor="middle" fill="#111111">Switch CLOSED -&gt; Pin reads HIGH</text>
  <text x="485" y="350" font-size="12" font-weight="bold" text-anchor="middle" fill="#a17d00">Default state = LOW</text>
</svg>
