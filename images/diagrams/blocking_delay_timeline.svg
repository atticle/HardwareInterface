<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="700" height="260" fill="#ffffff"/>
  <text x="350" y="26" font-size="17" font-weight="bold" text-anchor="middle" fill="#111111">HAL_Delay: Blocking Timeline</text>

  <!-- timeline segments -->
  <rect x="40" y="70" width="140" height="50" fill="#e2f5e9" stroke="#006622" stroke-width="1.5"/>
  <text x="110" y="100" font-size="13" text-anchor="middle" fill="#111111">LED1 ON</text>

  <rect x="180" y="70" width="140" height="50" fill="#e9e9e9" stroke="#555555" stroke-width="1.5"/>
  <text x="250" y="94" font-size="12" text-anchor="middle" fill="#111111">HAL_Delay(500)</text>
  <text x="250" y="110" font-size="11" text-anchor="middle" fill="#a10000">CPU Blocked</text>

  <rect x="320" y="70" width="140" height="50" fill="#fdeaea" stroke="#a10000" stroke-width="1.5"/>
  <text x="390" y="100" font-size="13" text-anchor="middle" fill="#111111">LED1 OFF</text>

  <rect x="460" y="70" width="140" height="50" fill="#e9e9e9" stroke="#555555" stroke-width="1.5"/>
  <text x="530" y="94" font-size="12" text-anchor="middle" fill="#111111">HAL_Delay(500)</text>
  <text x="530" y="110" font-size="11" text-anchor="middle" fill="#a10000">CPU Blocked</text>

  <!-- arrow showing repeat -->
  <line x1="40" y1="145" x2="600" y2="145" stroke="#333333" stroke-width="1.5"/>
  <text x="350" y="165" font-size="12" text-anchor="middle" fill="#555555">Time -&gt; (this 1000 ms pattern repeats forever)</text>

  <rect x="120" y="190" width="460" height="50" rx="6" fill="#f5f5f5" stroke="#888888" stroke-width="1"/>
  <text x="350" y="212" font-size="12" text-anchor="middle" fill="#111111">During "CPU Blocked" segments, no other code can run</text>
  <text x="350" y="230" font-size="12" text-anchor="middle" fill="#111111">(same idea as one customer at a bank teller window)</text>
</svg>
